[profile.default]
via_ir = true
optimizer = true
optimizer_runs = 100000
bytecode_hash = "none"
evm_version = "osaka"
dynamic_test_linking = true
ignored_error_codes = ["transient-storage"]

[profile.default.fmt]
wrap_comments = true

[lint]
ignore = [
    "lib/**",
    "src/imports/MorphoImport.sol",
    "src/imports/MidnightImport.sol",
    "src/imports/MetaMorphoImport.sol",
    "src/imports/MetaMorphoV1_1Import.sol",
    "src/imports/AdaptiveCurveIrmImport.sol",
    "test/**/*.sol",
]
exclude_lints = [
    "screaming-snake-case-immutable",
    "asm-keccak256",
    "unsafe-cheatcode",
    "incorrect-shift",
    "block-timestamp",
    "internal-function-used-once",
    "pragma-inconsistent",
    "missing-zero-check",
    "low-level-calls",
    "inline-assembly",
    "literal-instead-of-constant",
    "require-revert-in-loop",
    "multi-contract-file",
    "calls-loop",
    "arbitrary-send-erc20",
    "unused-return",
    "cyclomatic-complexity",
    "boolean-cst",
    "costly-loop",
    "missing-events-access-control",
    "uninitialized-local",
    "reentrancy-events",
]

[profile.no_via_ir]
via_ir = false

[fuzz]
runs = 2048

[[profile.default.compilation_restrictions]]
paths = "src/imports/MorphoImport.sol"
optimizer_runs = 999999
evm_version = "paris"

[[profile.default.compilation_restrictions]]
paths = "src/imports/MetaMorphoV1_1Import.sol"
optimizer_runs = 200
evm_version = "cancun"

[[profile.default.compilation_restrictions]]
paths = "src/imports/MetaMorphoImport.sol"
optimizer_runs = 200
evm_version = "cancun"

[[profile.default.compilation_restrictions]]
paths = "src/adapters/MidnightAdapter.sol"
optimizer_runs = 14949

# Midnight is compiled with its home repo's settings so it fits under EIP-170.
[[profile.default.compilation_restrictions]]
paths = "lib/midnight/src/Midnight.sol"
optimizer_runs = 466

# Registries have been deployed with the following settings differences, which are enforced here to avoid bytecode drift.
[[profile.default.compilation_restrictions]]
paths = "src/periphery/registries/**"
optimizer_runs = 999999
evm_version = "cancun"

# For every restriction above there must be some compatible foundry profile.
# The first matching profile will be used. For clarity, all profiles below should be incompatible with each other.

[[profile.default.additional_compiler_profiles]]
name = "999999-paris"
optimizer_runs = 999999
evm_version = "paris"

[[profile.default.additional_compiler_profiles]]
name = "200-cancun"
optimizer_runs = 200
evm_version = "cancun"

[[profile.default.additional_compiler_profiles]]
name = "14949-osaka"
optimizer_runs = 14949

[[profile.default.additional_compiler_profiles]]
name = "466-osaka"
optimizer_runs = 466

[[profile.default.additional_compiler_profiles]]
name = "999999-cancun"
optimizer_runs = 999999
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options
