name: Certora

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  matrix:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      confs: ${{ steps.list.outputs.confs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        run: echo "confs=$(find certora/confs -type f -name '*.conf' | sed 's|^certora/confs/||;s|\.conf$||' | sort | jq -nRc '[inputs]')" >> "$GITHUB_OUTPUT"

  verify:
    permissions:
      contents: read
    needs: matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        conf: ${{ fromJson(needs.matrix.outputs.confs) }}

    steps:
      - name: Install Java
        run: |
          java_dir="$RUNNER_TEMP/temurin-21.0.13+9"
          curl -fsSL -o "$RUNNER_TEMP/java.tar.gz" "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.13%2B9/OpenJDK21U-jdk_x64_linux_hotspot_21.0.13_9.tar.gz"
          # setup-java has no hardcoded Java hash; this check is needed.
          echo "d7f5d5cf865a2902b70ff549b97586a7d3f234e016f041ab447ea740c7d66d1c  $RUNNER_TEMP/java.tar.gz" | sha256sum --check --strict
          mkdir -p "$java_dir"
          tar -xzf "$RUNNER_TEMP/java.tar.gz" -C "$java_dir" --strip-components=1
          echo "JAVA_HOME=$java_dir" >> "$GITHUB_ENV"
          echo "$java_dir/bin" >> "$GITHUB_PATH"
          "$java_dir/bin/java" -version

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Python
        run: |
          python_dir="$RUNNER_TEMP/python-3.15.2"
          curl -fsSL -o "$RUNNER_TEMP/python.tar.gz" "https://github.com/astral-sh/python-build-standalone/releases/download/20261110/cpython-3.15.2%2B20261110-x86_64-unknown-linux-gnu-install_only_stripped.tar.gz"
          echo "ad23d1b73fac26440b0306ae06911031344c49a90ec19716c8362e7fa40cae43  $RUNNER_TEMP/python.tar.gz" | sha256sum --check --strict
          mkdir -p "$python_dir"
          tar -xzf "$RUNNER_TEMP/python.tar.gz" -C "$python_dir" --strip-components=1
          echo "$python_dir/bin" >> "$GITHUB_PATH"
          "$python_dir/bin/python" --version
          "$python_dir/bin/python" -m pip --version

      - name: Install certora
        run: pip install certora-cli

      # Per-conf lint, unlike the other repos: the formatter would put each long helper definition on one line.
      - name: Run Certora Config Linter
        run: |
          file="certora/confs/$CONF.conf"
          echo "Fix lint errors by applying the following diff to $file:"
          diff -u "$file" <(jq < "$file")
        env:
          CONF: ${{ matrix.conf }}

      - name: Run Certora Specs Linter
        run: |
          file="certora/specs/$CONF.spec"
          echo "Fix lint errors by applying the following diff to $file:"
          diff -u "$file" <(certoraCVLFormatter "$file")
        env:
          CONF: ${{ matrix.conf }}

      - name: Install solc (0.8.19)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.19/solc-static-linux
          echo "7a5c1d3dc9a8eba62bb2ec37192c9178ae5fe8a54a56e5573fd3c9c17cd9eb48  solc-static-linux" | sha256sum --check --strict
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.19

      - name: Install solc (0.8.21)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.21/solc-static-linux
          echo "f2857a898be15c69e8de5598dcd3f3e169e94964a0ce9a0bbb1b111f145a81df  solc-static-linux" | sha256sum --check --strict
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.21

      - name: Install solc (0.8.26)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.26/solc-static-linux
          echo "d5f23436f443edb85d8e76906d12f0a86ce0490e7663a9e608efeb7a93f149ef  solc-static-linux" | sha256sum --check --strict
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.26

      - name: Install solc (0.8.28)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.28/solc-static-linux
          echo "9a0fb7e0db2c0641dbae1c5cc645dc686820c83af516226abb1c0a2f76636f25  solc-static-linux" | sha256sum --check --strict
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.28

      - name: Install solc (0.8.34)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.34/solc-static-linux
          echo "d40adc6f9fdbb22a97d32a02fa05688bf2ee7886affc48c9851b0afd4a726b39  solc-static-linux" | sha256sum --check --strict
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.34

      - name: Install solc (0.8.37)
        run: |
          wget https://github.com/ethereum/solidity/releases/download/v0.8.37/solc-static-linux
          echo "5de843c2c93563cc66425c99a4fb13fdbf32b4c4ae07469480faaf126e14404a  solc-static-linux" | sha256sum --check --strict
          chmod +x solc-static-linux
          sudo mv solc-static-linux /usr/local/bin/solc-0.8.37

      - name: Apply munging
        run: make -C lib/metamorpho/certora munged

      - name: Verify ${{ matrix.conf }} specification
        run: certoraRun "certora/confs/$CONF.conf"
        env:
          CONF: ${{ matrix.conf }}
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
