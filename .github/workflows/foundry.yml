name: Foundry

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Run forge fmt
        run: forge fmt src test script certora --check

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Run forge lint
        run: forge lint src certora --deny notes

  sizes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Run forge build
        run: forge build --force --sizes

      - name: Check foundry.lock matches submodule pins
        run: forge build --locked

  test:
    needs: sizes
    strategy:
      fail-fast: true
      matrix:
        decimals: [0, 6, 8, 18, 24]
        isolate: [true, false]
        token-type: [0]
        include:
          - { token-type: 0, token: standard }
          - { decimals: 18, isolate: true, token-type: 1, token: no-revert }
          - { decimals: 18, isolate: true, token-type: 2, token: usdt }
          - { decimals: 18, isolate: true, token-type: 3, token: revert-to-zero }
          - { decimals: 18, isolate: true, token-type: 4, token: no-return }
          - { decimals: 18, isolate: false, token-type: 1, token: no-revert }
          - { decimals: 18, isolate: false, token-type: 2, token: usdt }
          - { decimals: 18, isolate: false, token-type: 3, token: revert-to-zero }
          - { decimals: 18, isolate: false, token-type: 4, token: no-return }

    runs-on: ubuntu-latest
    name: "test (${{ matrix.decimals }} decimals, isolate: ${{ matrix.isolate }}, ${{ matrix.token }} token)"
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1

      - name: Run forge tests with a ${{ matrix.decimals }} decimals underlying asset
        run: if [ ${{ matrix.isolate }} = true ]; then forge test -vvv --isolate; else forge test -vvv; fi
        env:
          DECIMALS: ${{ matrix.decimals }}
          TOKEN_TYPE: ${{ matrix.token-type }}
